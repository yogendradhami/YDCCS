
name: Daily Compliance Notifications

on:
  schedule:
    # Adelaide daylight time (UTC+10:30)
    - cron: "30 21 * * *"
    # Adelaide standard time (UTC+9:30)
    - cron: "30 22 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Preview without creating notifications"
        type: boolean
        required: true
        default: true

permissions:
  contents: read

concurrency:
  group: daily-compliance-notifications
  cancel-in-progress: false

jobs:
  compliance-notifications:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      DJANGO_SETTINGS_MODULE: ydcleaning.settings
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DJANGO_SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY }}
      DJANGO_DEBUG: ${{ secrets.DJANGO_DEBUG }}
      IS_PRODUCTION: ${{ secrets.IS_PRODUCTION }}
      ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
      CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
      CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
      CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}

    steps:
      - name: Check Adelaide local time
        id: clock
        if: github.event_name == 'schedule'
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          from datetime import datetime
          from zoneinfo import ZoneInfo
          now = datetime.now(ZoneInfo("Australia/Adelaide"))
          print(f"run={str(now.hour == 8 and now.minute < 15).lower()}")
          PY

      - name: Check out repository
        if: github.event_name != 'schedule' || steps.clock.outputs.run == 'true'
        uses: actions/checkout@v4

      - name: Set up Python
        if: github.event_name != 'schedule' || steps.clock.outputs.run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        if: github.event_name != 'schedule' || steps.clock.outputs.run == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check Django configuration
        if: github.event_name != 'schedule' || steps.clock.outputs.run == 'true'
        run: python manage.py check

      - name: Preview notifications
        if: github.event_name == 'workflow_dispatch' && inputs.dry_run
        run: python manage.py send_compliance_notifications --dry-run

      - name: Create compliance notifications
        if: (github.event_name == 'schedule' && steps.clock.outputs.run == 'true') || (github.event_name == 'workflow_dispatch' && !inputs.dry_run)
        run: python manage.py send_compliance_notifications
