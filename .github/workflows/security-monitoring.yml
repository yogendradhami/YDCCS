name: YDCCS Security Monitoring

on:
  schedule:
    # Security alert queue: hourly at minute 17 UTC
    - cron: "17 * * * *"

    # Website and Django security audit: twice daily
    - cron: "37 0,12 * * *"

    # Daily security report at 22:30 UTC
    - cron: "30 22 * * *"

  workflow_dispatch:
    inputs:
      task:
        description: "Which security task should run?"
        required: true
        type: choice
        options:
          - alerts
          - audit
          - report

permissions:
  contents: read

concurrency:
  group: security-monitoring-${{ github.event.schedule || inputs.task || github.run_id }}
  cancel-in-progress: false

jobs:
  security-monitoring:
    name: Run Django security task
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    env:
      DJANGO_SETTINGS_MODULE: ydcleaning.settings
      DJANGO_DEBUG: "False"
      IS_PRODUCTION: "True"
      DJANGO_ALLOWED_HOSTS: "ydcleaning.com.au,www.ydcleaning.com.au"
      SITE_URL: "https://www.ydcleaning.com.au"
      SECURITY_MONITORING_ENABLED: "True"

      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DJANGO_SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY }}
      CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
      CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
      CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
      ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      SECURITY_ALERT_EMAIL: ${{ secrets.SECURITY_ALERT_EMAIL }}
      DEFAULT_FROM_EMAIL: ${{ secrets.DEFAULT_FROM_EMAIL }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      # GitHub scheduled-event payloads can be awkward to use for dispatching
      # multiple different cron entries in one workflow. Make the choice explicit.
      - name: Select scheduled task
        id: task
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          MANUAL_TASK: ${{ inputs.task }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            task="$MANUAL_TASK"
          else
            case "$SCHEDULE" in
              "17 * * * *") task="alerts" ;;
              "37 0,12 * * *") task="audit" ;;
              "30 22 * * *") task="report" ;;
              *)
                echo "::error::Unrecognised schedule: $SCHEDULE"
                exit 1
                ;;
            esac
          fi
          echo "task=$task" >> "$GITHUB_OUTPUT"
          echo "Selected security task: $task"

      - name: Process security alert queue
        if: ${{ steps.task.outputs.task == 'alerts' }}
        run: python manage.py process_security_alerts

      - name: Run website and Django security audit
        if: ${{ steps.task.outputs.task == 'audit' }}
        run: python manage.py run_security_audit

      - name: Run audit and send daily security report
        if: ${{ steps.task.outputs.task == 'report' }}
        run: python manage.py run_security_audit --report
