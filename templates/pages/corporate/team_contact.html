{% extends "base.html" %}

{% block title %}
Speak With Our Team | YD Commercial Cleaning
{% endblock %}

{% block content %}

<section class="corporate-form-page">
    <div class="container">

        <h1>Speak With Our Team</h1>

        <p>
            Have a corporate cleaning requirement?
            Send us your details and our team will contact you.
        </p>

        <form method="post">
            {% csrf_token %}

            {{ form.as_p }}

            <button type="submit">
                Speak With Our Team
            </button>
        </form>

    </div>
</section>

{% endblock %}
