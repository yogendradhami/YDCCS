{% extends "dashboard_base.html" %}

{% block page_title %}
Induction Setup
{% endblock %}

{% block page_subtitle %}
Configure the employee's onboarding programme.
{% endblock %}

{% block content %}

<div class="employee-panel">

    <h2>
        {{ induction.employee.full_name }}
    </h2>

    <form method="post">

        {% csrf_token %}

        {{ form.as_p }}

        <div class="form-actions">

            <button
                type="submit"
                class="btn btn-primary"
            >
                Save Induction
            </button>

            <a
                href="{% url 'induction_detail' induction.id %}"
                class="btn btn-outline"
            >
                Cancel
            </a>

        </div>

    </form>

</div>

{% endblock %}
